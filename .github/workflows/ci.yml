name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x bootstrap.sh install.sh lib/*.sh steps/*.sh shell/rc.sh $(grep -l '^#!.*bash' bin/*) test/*.sh

  devcontainer:
    # `ide` in a project with a dev container: IDE runs inside it (needs a real Docker daemon)
    runs-on: ubuntu-latest
    env:
      # so the mise shims (devcontainer, node) resolve versions from the repo's pins
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/config/mise/config.toml
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: "node npm:@devcontainers/cli"
      - name: test/devcontainer-smoke.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: test/devcontainer-smoke.sh image && test/devcontainer-smoke.sh compose

  install:
    # Full install as a new server would get it, then tool checks and the IDE smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:24.04, debian:12, archlinux:latest]
    steps:
      - uses: actions/checkout@v4
      - name: test/docker.sh ${{ matrix.image }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # avoids GitHub API rate limits in mise
        run: test/docker.sh "${{ matrix.image }}"
