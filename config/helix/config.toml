theme = "catppuccin_mocha"

[editor]
line-number = "relative"
cursorline = true
bufferline = "multiple"
color-modes = true
true-color = true
mouse = true
end-of-line-diagnostics = "hint"
auto-save = { focus-lost = true, after-delay.enable = true, after-delay.timeout = 1500 }

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.lsp]
display-inlay-hints = true
display-messages = true

[editor.file-picker]
hidden = false          # show dotfiles; .gitignore is still respected

[editor.indent-guides]
render = true

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "file-encoding"]

[keys.normal]
C-s = ":write"
C-r = ":reload-all"     # pick up changes made in lazygit
"tab" = ":buffer-next"
"S-tab" = ":buffer-previous"
